# For developer use of the `alembic` CLI (e.g. `uv run alembic revision --autogenerate -m "..."`).
# The app migrates via `autotrader db upgrade`. The DB URL comes from config.yaml, not from here.
[alembic]
script_location = autotrader.journal:migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
