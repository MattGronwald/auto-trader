[project]
name = "autotrader"
version = "0.1.0"
description = "Automated, agent-based crypto trading PoC (Alpaca paper first)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.4",
    "typer>=0.27.3",
]

[project.scripts]
autotrader = "autotrader.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit (eval/exec, hard-coded secrets)
    "SIM", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of tests

[tool.mypy]
python_version = "3.12"
# SPEC requires strict on core/, risk/, broker/. Applied project-wide for now; relax per
# module with an override if api/ or journal/ ever make it impractical.
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not smoke'"
asyncio_mode = "auto"
markers = [
    "smoke: hits real external APIs (Alpaca, Anthropic); opt-in via `-m smoke`",
]

[tool.coverage.run]
branch = true
source = ["autotrader"]
